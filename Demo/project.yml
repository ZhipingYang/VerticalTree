name: VerticalTreeDemo

options:
  createIntermediateGroups: true
  # CocoaPods/xcodeproj 1.25.x cannot parse xcode16_3 objectVersion yet.
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "26.2"

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "6"

targets:
  VerticalTreeDemo:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources:
      - path: Sources
        group: VerticalTreeDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xcodeyang.VerticalTreeDemo
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        DEVELOPMENT_LANGUAGE: en
        CLANG_ENABLE_MODULES: YES
    scheme:
      gatherCoverageData: false
